name: CI

# Runs on every branch except main/beta and on pull requests. The release
# workflow owns main: this instance has one runner whose working copy each job
# empties on entry, so two workflows on the same commit would destroy each
# other's files. main is only reached through branches this workflow has
# checked, and release.yml re-runs the same checks before publishing anything.
on:
  push:
    branches: ['**', '!main', '!beta']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

env:
  CARGO_TERM_COLOR: always
  # Outside the (wiped) working copy so builds stay incremental between jobs.
  CARGO_HOME: C:\hs-ci\cargo
  CARGO_TARGET_DIR: C:\hs-ci\target

jobs:
  check:
    runs-on: windows-latest
    steps:
      # No published actions: the runner cannot fetch them from
      # code.forgejo.org (forgejo#2809) and has no Node. A manual checkout is a
      # few lines and has neither problem.
      - name: Check out this commit
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -Force . | Remove-Item -Recurse -Force
          git init --quiet --initial-branch=ci .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          # The credential goes on the command line only, never into .git/config.
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:TOKEN"))
          $auth = "http.extraheader=Authorization: Basic $basic"
          git -c $auth fetch --quiet --depth=1 origin ${{ github.sha }}
          git checkout --quiet --detach FETCH_HEAD
          git log --oneline -1

      # Until Phase 0 creates the Cargo workspace there is nothing to build;
      # the job then passes after checking that the scripts at least parse.
      - name: Detect the Cargo workspace
        id: ws
        run: |
          $ErrorActionPreference = "Stop"
          $has = Test-Path Cargo.toml
          "has_cargo=$($has.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not $has) { Write-Host "No Cargo.toml yet - documentation-only repository; skipping Rust checks." }
          foreach ($s in Get-ChildItem scripts -Filter *.ps1) {
            # [ref] needs an existing variable; an undeclared one throws under Stop.
            $tokens = $null; $errs = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($s.FullName, [ref]$tokens, [ref]$errs)
            if ($errs -and $errs.Count) { throw "$($s.Name) does not parse: $($errs[0].Message)" }
          }
          Write-Host "PowerShell scripts parse."

      # The release planner decides every version; its rules are tested
      # against throwaway git repositories (scripts/tests/).
      - name: Release script tests (Pester)
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]"5.5" })) {
            try {
              Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
            } catch {
              Write-Warning "Pester 5 is not installed and could not be fetched ($_); skipping the script tests."
              exit 0
            }
          }
          Import-Module Pester -MinimumVersion 5.5
          $r = Invoke-Pester scripts/tests -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) script test(s) failed" }

      - name: Rust toolchain
        if: steps.ws.outputs.has_cargo == 'true'
        run: |
          $ErrorActionPreference = "Stop"
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version; cargo --version
          if (-not (Get-Command cargo-deny -ErrorAction SilentlyContinue)) { cargo install cargo-deny --locked }

      - name: Formatting
        if: steps.ws.outputs.has_cargo == 'true'
        run: cargo fmt --all --check

      - name: Clippy
        if: steps.ws.outputs.has_cargo == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        if: steps.ws.outputs.has_cargo == 'true'
        env:
          # Container-backed integration tests only run when the runner has
          # Docker and this secret is set; otherwise they are skipped.
          HS_INTEGRATION: ${{ secrets.HS_INTEGRATION }}
        run: cargo test --workspace --locked

      - name: Dependency audit
        if: steps.ws.outputs.has_cargo == 'true'
        run: cargo deny check

      - name: Release build
        if: steps.ws.outputs.has_cargo == 'true'
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release --locked -p hyperstack
          Get-Item "$env:CARGO_TARGET_DIR/release/HyperStack.exe" | Select-Object FullName, Length, LastWriteTime

      - name: Smoke test the executable
        if: steps.ws.outputs.has_cargo == 'true'
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "$env:CARGO_TARGET_DIR/release/HyperStack.exe"
          # RUNNER_TEMP is not set by every runner; fall back to the system temp dir.
          $base = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [System.IO.Path]::GetTempPath() }
          $tmp = Join-Path $base "hs-smoke-$([guid]::NewGuid().ToString('N').Substring(0, 8))"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Write-Host "self-test data dir: $tmp"
          # HyperStack.exe is a GUI-subsystem binary: `& $exe` does not wait for it
          # and leaves $LASTEXITCODE empty. Start-Process -Wait gives a real exit code.
          $p = Start-Process -FilePath $exe -ArgumentList @('--version') -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "--version exited with $($p.ExitCode)" }
          $p = Start-Process -FilePath $exe -ArgumentList @('--self-test', '--data-dir', $tmp) -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "--self-test exited with $($p.ExitCode)" }
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          # Portable guarantee: nothing may be written outside the data dir.
          if (Test-Path "$env:APPDATA\HyperStack") { throw "The app wrote to %APPDATA% during --self-test" }
          if (Test-Path "$env:LOCALAPPDATA\HyperStack") { throw "The app wrote to %LOCALAPPDATA% during --self-test" }
