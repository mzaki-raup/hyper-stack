name: Release

# Every push to main is a release candidate. scripts/next-release.ps1 reads the
# commit subjects since the last v* tag (Conventional Commits first, plain
# verbs as a fallback): feat → minor, fix/perf/security → patch, BREAKING
# CHANGE → major, only docs/chore/refactor/test/ci → nothing to release, and
# the job stops cleanly. A push to the beta branch publishes a vX.Y.Z-beta.N
# pre-release instead.
#
# Assets published per release. The in-app updater reads these exact names, so
# they are a contract (docs/09-ci-cd-and-updates.md §4.3):
#
#   HyperStack.exe                          bare executable, downloaded by the updater
#   HyperStack-<version>-windows-x64.zip    manual update (exe + README.txt + LICENSE + notes)
#   manifest.json                           version, channel, assets with size + sha256
#   manifest.json.minisig                   Ed25519 signature of manifest.json
#   SHA256SUMS.txt                          for humans and scripts
#   CHANGELOG-<version>.md                  the notes, also the release body
#
# Never let this job go green without all of them on the forge: a release that
# lacks assets is read by the app as "no installable release", and users stay
# on the old version without knowing why. The last step downloads the release
# anonymously and verifies it the way the app does.
#
# As in ci.yml, nothing here uses a published action (forgejo#2809).
on:
  push:
    branches: [main, beta]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

env:
  CARGO_TERM_COLOR: always
  CARGO_HOME: C:\hs-ci\cargo
  CARGO_TARGET_DIR: C:\hs-ci\target
  # The forge attributes a release to the account whose email matches the
  # tag's author; an unknown email publishes as "Ghost".
  TAGGER_NAME: HyperStack Release
  TAGGER_EMAIL: owner@zacx.net

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out with full history and tags
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -Force . | Remove-Item -Recurse -Force
          git init --quiet --initial-branch=release .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:TOKEN"))
          $auth = "http.extraheader=Authorization: Basic $basic"
          # Not shallow, and with every tag: the version and the notes are both
          # worked out from the commits since the last tag.
          # Cloudflare sometimes resets this fetch mid-pack. A partial pack
          # cannot be resumed, so throw the repository away and start clean.
          $fetched = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            git -c $auth fetch --quiet --tags origin
            if ($LASTEXITCODE -eq 0) {
              $fetched = $true
              break
            }
            Write-Host "fetch failed (attempt $attempt/5); restarting the checkout"
            Remove-Item .git -Recurse -Force -ErrorAction SilentlyContinue
            git init --quiet --initial-branch=release .
            git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
            Start-Sleep -Seconds (5 * $attempt)
          }
          if (-not $fetched) {
            throw "could not fetch the repository after 5 attempts"
          }
          git checkout --quiet --detach ${{ github.sha }}
          git log --oneline -1

      # Writes version/tag/channel to $GITHUB_OUTPUT and the notes to
      # release/notes.md. Leaves version empty when nothing is release-worthy,
      # and also when the Cargo workspace does not exist yet (Phase 0 has not
      # started), so documentation pushes stay green and publish nothing.
      - name: Plan the release
        id: plan
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path Cargo.toml)) {
            Write-Host "No Cargo.toml yet - nothing can be released."
            "version=" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            "tag="     | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $channel = if ("${{ github.ref_name }}" -eq "beta") { "beta" } else { "stable" }
          # A release job that tagged and pushed but died before publishing
          # leaves a tag with no release; plan that version again so the next
          # push to main publishes it (scripts/next-release.ps1 -Republish).
          $republish = ""
          $pattern = if ($channel -eq "beta") { '^v\d+\.\d+\.\d+(-beta\.\d+)?$' } else { '^v\d+\.\d+\.\d+$' }
          $latest = @(git tag --list "v*" --sort=-v:refname | Where-Object { $_ -match $pattern }) | Select-Object -First 1
          if ($latest) {
            $api = "${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
            $headers = @{ Authorization = "token $env:TOKEN" }
            $published = $false
            try {
              $r = Invoke-RestMethod -Method Get -Headers $headers -Uri "$api/releases/tags/$([uri]::EscapeDataString($latest))"
              $published = -not $r.draft
            } catch { $published = $false }
            if (-not $published) { $republish = $latest; Write-Host "$latest has no published release." }
          }
          pwsh -NoProfile -File scripts/next-release.ps1 -Channel $channel -Republish $republish

      - name: Rust toolchain
        if: steps.plan.outputs.version != ''
        run: |
          $ErrorActionPreference = "Stop"
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          if (-not (Get-Command cargo-deny -ErrorAction SilentlyContinue)) { cargo install cargo-deny --locked }
          if (-not (Get-Command rsign -ErrorAction SilentlyContinue)) { cargo install rsign2 --locked }

      - name: Formatting
        if: steps.plan.outputs.version != ''
        run: cargo fmt --all --check

      - name: Clippy
        if: steps.plan.outputs.version != ''
        # -j 4: this runner is the owner's own machine, where an unbounded
        # parallel build exhausts the page file
        # (.claude/rules/build-and-run.md). CI run 471 died with
        # `rustc-LLVM ERROR: out of memory` for want of this.
        run: cargo clippy --workspace --all-targets --locked -j 4 -- -D warnings

      - name: Tests
        if: steps.plan.outputs.version != ''
        run: cargo test --workspace --locked -j 4

      - name: Dependency audit
        if: steps.plan.outputs.version != ''
        run: cargo deny check

      # Before the build, so the binary reports the released version. Nothing
      # is pushed until the build and packaging succeed.
      - name: Set the version, update the changelog, commit and tag locally
        if: steps.plan.outputs.version != '' && steps.plan.outputs.republish != 'true'
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -File scripts/update-version.ps1 -Version ${{ steps.plan.outputs.version }} -NotesFile release/notes.md
          git config user.name "$env:TAGGER_NAME"
          git config user.email "$env:TAGGER_EMAIL"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          # [skip ci] so pushing this back does not start another release.
          git commit --quiet -m "chore(release): ${{ steps.plan.outputs.tag }} [skip ci]"
          # Annotated, on the bumped commit, so the tag and the Cargo.toml at
          # that tag always agree.
          git tag -a ${{ steps.plan.outputs.tag }} -m "${{ steps.plan.outputs.tag }}"
          git log --oneline -1

      - name: Build, package and sign
        if: steps.plan.outputs.version != ''
        env:
          HS_CHANNEL: ${{ steps.plan.outputs.channel }}
          HS_MINISIGN_KEY: ${{ secrets.HS_MINISIGN_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:HS_MINISIGN_KEY) { throw "The HS_MINISIGN_KEY secret is not configured; releases must be signed (see keys/README.md)." }
          pwsh -NoProfile -File scripts/build-and-package.ps1 -Version ${{ steps.plan.outputs.version }} -Channel ${{ steps.plan.outputs.channel }}

      - name: Push the version commit and the tag
        if: steps.plan.outputs.version != '' && steps.plan.outputs.republish != 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:TOKEN"))
          $auth = "http.extraheader=Authorization: Basic $basic"
          git -c $auth push --quiet origin HEAD:${{ github.ref_name }}
          git -c $auth push --quiet origin ${{ steps.plan.outputs.tag }}
          Write-Host "Pushed ${{ steps.plan.outputs.tag }} and the version commit to ${{ github.ref_name }}."

      - name: Publish the release
        if: steps.plan.outputs.version != ''
        env:
          # Forgejo hands the workflow a token with write access to this
          # repository; the API is Forgejo's /api/v1.
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: the forge's own address on the LAN, so assets do not
          # go through Cloudflare. Cloudflare gives the origin about 100
          # seconds to answer a request and cuts it with a 524 otherwise:
          # the 34 MB zip needed six minutes of retries through it (runs 92
          # and 95 died there), and took 0.24 s straight to the origin. The
          # 83 MB exe is also close to the free plan's 100 MB body cap.
          # Set it in the forge's repository secrets; it must stay unset on
          # GitHub, where there is no such route.
          UPLOAD_URL: ${{ secrets.HS_FORGE_UPLOAD_URL }}
        run: |
          # Without Stop, a non-terminating error carries on and the job can
          # go green having attached nothing.
          $ErrorActionPreference = "Stop"
          $api = "${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          $headers = @{ Authorization = "token $env:TOKEN" }
          # Assets go straight to the origin when a LAN address is
          # configured. The Host header keeps the proxy routing to the same
          # virtual host, so only the transport changes: the same forge,
          # the same release, the same published links.
          $vhost = ([uri]"${{ github.server_url }}").Host
          $uploadApi = $api
          $hostArg = @()
          if ($env:UPLOAD_URL) {
            $uploadApi = "$($env:UPLOAD_URL.TrimEnd('/'))/api/v1/repos/${{ github.repository }}"
            $hostArg = @("-H", "Host: $vhost")
            Write-Host "Assets go to $($env:UPLOAD_URL) as $vhost, not through the proxy."
          }
          $tag = "${{ steps.plan.outputs.tag }}"
          $version = "${{ steps.plan.outputs.version }}"
          $prerelease = "${{ steps.plan.outputs.channel }}" -eq "beta"
          $notes = Get-Content "release/dist/CHANGELOG-$version.md" -Raw
          if ([string]::IsNullOrWhiteSpace($notes)) { throw "Release notes are empty." }

          # The forge derives a release row from the pushed tag asynchronously,
          # so a PATCH that lands before it is clobbered. Reuse or create the
          # row, upload the assets, apply the metadata LAST, then confirm in a
          # loop rather than once.
          # Creating the row right after the tag push can fail while the
          # forge is still deriving its own row for the tag (run 66: an
          # empty error body), so fetch-or-create is retried a few times.
          $release = $null
          for ($try = 1; $try -le 8 -and -not $release; $try++) {
            try { $release = Invoke-RestMethod -Method Get -Headers $headers -Uri "$api/releases/tags/$([uri]::EscapeDataString($tag))" } catch { $release = $null }
            if ($release) { Write-Host "The forge already has a release for $tag (id $($release.id))"; break }
            try {
              $body = @{ tag_name = $tag; name = "HyperStack $version"; body = $notes; draft = $true; prerelease = $prerelease } | ConvertTo-Json -Depth 4
              $release = Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Uri "$api/releases" -Body $body
              Write-Host "Created release $($release.id)"
            } catch {
              Write-Host "Attempt ${try}: creating the release failed: $($_.Exception.Message)"
              $release = $null
              Start-Sleep -Seconds 5
            }
          }
          if (-not $release) { throw "Could not fetch or create the release row for $tag." }

          # git.zacx.net sits behind Cloudflare and the link to it drops
          # connections all day - the runner's own control channel logs the
          # same resets, 17 of them on the day of v0.29.1 - so a 34 MB asset
          # often does not survive one try: runs 92 and 95 both died on the
          # file after the changelog. Invoke-RestMethod buffers the body and
          # gives up on the first reset; curl streams the file from disk and
          # retries the transfer itself, and the loop around it covers a
          # reset that lands between transfers.
          $curl = Join-Path $env:SystemRoot "System32\curl.exe"
          if (-not (Test-Path $curl)) { throw "curl.exe is missing; the asset upload needs it." }
          $expected = @(Get-ChildItem release/dist -File | ForEach-Object { $_.Name })
          foreach ($file in Get-ChildItem release/dist -File) {
            $sent = $false
            for ($try = 1; $try -le 5 -and -not $sent; $try++) {
              try {
                # A half-written asset from a failed attempt is replaced,
                # not refused.
                $existing = Invoke-RestMethod -Method Get -Headers $headers -Uri "$api/releases/$($release.id)/assets"
                $dup = $existing | Where-Object { $_.name -eq $file.Name }
                if ($dup) { Invoke-RestMethod -Method Delete -Headers $headers -Uri "$api/releases/$($release.id)/assets/$($dup.id)" | Out-Null }
                $url = "$uploadApi/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($file.Name))"
                & $curl --silent --show-error --fail --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 --max-time 1800 @hostArg -H "Authorization: token $env:TOKEN" -F "attachment=@$($file.FullName)" $url | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "curl exited ${LASTEXITCODE}" }
                $sent = $true
                Write-Host "Uploaded $($file.Name)"
              } catch {
                Write-Host "Attempt ${try} at $($file.Name) failed: $($_.Exception.Message)"
                Start-Sleep -Seconds (15 * $try)
              }
            }
            if (-not $sent) { throw "Could not upload $($file.Name) after 5 attempts." }
          }

          $patch = @{ name = "HyperStack $version"; body = $notes; draft = $false; prerelease = $prerelease } | ConvertTo-Json -Depth 4
          $ok = $false
          for ($i = 0; $i -lt 10 -and -not $ok; $i++) {
            # A reset here used to end the step with every asset already
            # uploaded; it is just another attempt.
            try {
              Invoke-RestMethod -Method Patch -Headers $headers -ContentType 'application/json' -Uri "$api/releases/$($release.id)" -Body $patch | Out-Null
              Start-Sleep -Seconds 3
              $check = Invoke-RestMethod -Method Get -Headers $headers -Uri "$api/releases/$($release.id)"
            } catch {
              Write-Host "Attempt $($i + 1): the forge did not answer: $($_.Exception.Message)"
              Start-Sleep -Seconds 10
              continue
            }
            $names = @($check.assets | ForEach-Object { $_.name })
            $missing = @($expected | Where-Object { $names -notcontains $_ })
            $ok = (-not $check.draft) -and ($check.body -eq $notes) -and ($missing.Count -eq 0)
            if (-not $ok) { Write-Host "Attempt $($i + 1): draft=$($check.draft) bodyOk=$($check.body -eq $notes) missing=$($missing -join ',')" }
          }
          if (-not $ok) { throw "The forge did not confirm the release metadata and assets after 10 attempts." }
          Write-Host "Published $tag with $($expected.Count) assets."

      # The end-to-end test of the pipeline: download anonymously exactly as
      # the app does, verify signature, sizes, hashes, run --self-test.
      - name: Verify the published release as a user would
        if: steps.plan.outputs.version != ''
        run: pwsh -NoProfile -File scripts/verify-release.ps1 -Tag ${{ steps.plan.outputs.tag }} -Repository ${{ github.repository }} -Server ${{ github.server_url }}

      # GitHub builds a release only when the tag reaches it (docs/09 §10.3).
      # Fast-forwards the mirror's branch to the version commit and pushes the
      # tag with a GitHub token held as a forge secret; skipped when the
      # secrets are absent. Runs last so GitHub only ever sees a tag that
      # Forgejo published and verified.
      - name: Hand the release to the GitHub mirror
        if: steps.plan.outputs.version != ''
        env:
          HS_GITHUB_MIRROR_URL: ${{ secrets.HS_GITHUB_MIRROR_URL }}
          HS_GITHUB_MIRROR_TOKEN: ${{ secrets.HS_GITHUB_MIRROR_TOKEN }}
        run: pwsh -NoProfile -File scripts/push-to-mirror.ps1 -Tag ${{ steps.plan.outputs.tag }} -Branch ${{ github.ref_name }}
