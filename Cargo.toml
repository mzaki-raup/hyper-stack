[workspace]
resolver = "3"
members = [
  "crates/hs-core",
  "crates/hs-ui",
  "crates/hs-term",
  "crates/hyperstack",
  "crates/tools/tool-terminal",
  "crates/hs-editor",
  "crates/tools/tool-editor",
  "crates/hs-ssh",
  "crates/hs-git",
  "crates/hs-lsp",
  "crates/hs-dap",
  "crates/tools/tool-ssh",
  "crates/tools/tool-s3",
  "crates/tools/tool-db",
  "crates/tools/tool-devtools",
  "crates/tools/tool-api",
  "crates/tools/tool-graphics",
  "crates/tools/tool-browser",
  "crates/tools/tool-redis",
  "crates/tools/tool-nosql",
]

# The single source of truth for the version. scripts/update-version.ps1 moves it;
# never edit it by hand (docs/09-ci-cd-and-updates.md §3).
[workspace.package]
version = "0.44.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://git.zacx.net/owner/hyper-stack"
authors = ["owner <owner@zacx.net>"]
# These crates are never uploaded to crates.io (also tells cargo-deny that path deps are fine).
publish = false

[workspace.dependencies]
hs-core = { path = "crates/hs-core" }
hs-ui = { path = "crates/hs-ui" }
hs-term = { path = "crates/hs-term" }
tool-terminal = { path = "crates/tools/tool-terminal" }
hs-editor = { path = "crates/hs-editor" }
tool-editor = { path = "crates/tools/tool-editor" }
hs-ssh = { path = "crates/hs-ssh" }
hs-git = { path = "crates/hs-git" }
hs-lsp = { path = "crates/hs-lsp" }
hs-dap = { path = "crates/hs-dap" }
tool-ssh = { path = "crates/tools/tool-ssh" }
tool-s3 = { path = "crates/tools/tool-s3" }
tool-db = { path = "crates/tools/tool-db" }
tool-devtools = { path = "crates/tools/tool-devtools" }
tool-api = { path = "crates/tools/tool-api" }
tool-graphics = { path = "crates/tools/tool-graphics" }
tool-browser = { path = "crates/tools/tool-browser" }
tool-redis = { path = "crates/tools/tool-redis" }
tool-nosql = { path = "crates/tools/tool-nosql" }

# UI
eframe = "0.35"
egui = { version = "0.35", features = ["serde"] }
egui_extras = { version = "0.35", features = ["image", "svg"] }
egui-phosphor = { version = "0.13", features = ["regular", "fill"] }
egui_kittest = "0.35"
image = { version = "0.25", default-features = false, features = [
    "png",
    "ico",
    "jpeg",
    "bmp",
    "gif",
    "webp",
] }

# Async, concurrency
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Serialisation, storage
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }

# Secrets
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
rand = "0.9"
base64 = "0.22"
hmac = "0.12"
md-5 = "0.10"
sha2 = "0.10"
minisign-verify = "0.2"

# Platform, paths, misc
dirs = "6"
ulid = "1"
semver = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
similar = "2"
regex = "1"
clap = { version = "4", features = ["derive"] }
fluent = "0.16"
fluent-bundle = "0.15"
unic-langid = { version = "0.9", features = ["macros"] }
sys-locale = "0.3"
rust-embed = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
portable-pty = "0.9"
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3"
alacritty_terminal = "0.26"
ropey = "1.6"
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy", "html"] }
encoding_rs = "0.8"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rfd = "0.17"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
# tar, for the SFTP pane's "Download Zipped" (tar.gz alongside zip).
tar = { version = "0.4", default-features = false }
# Laying a SQL statement out again (Database -> Prettify).
sqlformat = "0.5"
notify = "8"
tempfile = "3"
ttf-parser = "0.25"
reqwest = { version = "0.13", features = ["stream", "json", "gzip"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"
# Database drivers. TLS through rustls with the ring provider (no NASM/CMake on Windows).
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
# The system clipboard's file list (CF_HDROP) is Win32; everything else in
# hs-core stays portable.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
] }
# Redis/Valkey. TLS through the same rustls+ring stack as the SQL drivers.
redis = { version = "1.7", default-features = false, features = [
    "acl",
    "streams",
    "script",
    "tokio-comp",
    "tokio-rustls-comp",
] }
# MongoDB. Its rustls-tls feature pins the ring provider, like the others.
mongodb = { version = "3.9", default-features = false, features = [
    "rustls-tls",
    "dns-resolver",
    "compat-3-3-0",
    "bson-3",
] }
# The driver re-exports this; `serde_json-1` is what gives us Extended JSON
# in both directions, which is how documents reach the editor.
bson = { version = "3", features = ["serde", "serde_json-1"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
