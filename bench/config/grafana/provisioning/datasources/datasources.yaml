apiVersion: 1
datasources:
  # Grafana's built-in generator of test series: no real metrics server needed.
  - name: TestData
    uid: testdata
    type: grafana-testdata-datasource
    access: proxy
    isDefault: true
  # The bench's Loki holds the demo log lines (seed/seed-grafana.sh).
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
