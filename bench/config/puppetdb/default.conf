server {
  listen 80;
  default_type application/json;
  location = /pdb/meta/v1/version { alias /data/version.json; }
  location = /pdb/query/v4/nodes { alias /data/nodes.json; }
  location = /pdb/query/v4/reports { alias /data/reports.json; }
  location ~ ^/pdb/query/v4/reports/([A-Za-z0-9-]+)/logs$ { alias /data/logs-$1.json; }
  location = /orchestrator/v1/command/deploy { return 202 '{"job":{"id":"http://127.0.0.1:8082/orchestrator/v1/jobs/1234","name":"1234"}}'; }
}
