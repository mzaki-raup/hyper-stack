# Namespace `ops`: two broken workloads on purpose, for the Problems inbox
# and the pane's "needs attention" count - one container that exits non-zero
# (CrashLoopBackOff) and one whose image tag does not exist (ImagePullBackOff).
apiVersion: v1
kind: Namespace
metadata:
  name: ops
  labels: { hs-bench: "true" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash
  namespace: ops
  labels: { app: crash }
spec:
  replicas: 1
  selector:
    matchLabels: { app: crash }
  template:
    metadata:
      labels: { app: crash }
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo starting the billing worker; sleep 2; echo 'ERROR: BILLING_URL is not set' >&2; exit 1"]
          resources:
            requests: { cpu: 1m, memory: 4Mi }
            limits: { memory: 16Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pull
  namespace: ops
  labels: { app: pull }
spec:
  replicas: 1
  selector:
    matchLabels: { app: pull }
  template:
    metadata:
      labels: { app: pull }
    spec:
      containers:
        - name: app
          image: busybox:0.0.0-does-not-exist
          resources:
            requests: { cpu: 1m, memory: 4Mi }
            limits: { memory: 16Mi }
