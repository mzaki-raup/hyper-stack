[package]
name = "hs-container"
description = "HyperStack container drivers: Docker and Podman engines, Kubernetes clusters, and the connection fields they are configured by"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
futures-util = { workspace = true }
hs-core = { workspace = true }
# A pod's shell is an `hs_term` transport, exactly as an SSH channel
# is: the Terminal activity runs one without knowing which it has.
hs-term = { workspace = true }
k8s-openapi = { workspace = true }
kube = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
toml = { workspace = true }
# `net` and `io-util` for the port forward: a local listener and the
# bidirectional copy between it and the API server's stream.
tokio = { workspace = true, features = ["net", "io-util"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
