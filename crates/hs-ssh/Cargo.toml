[package]
name = "hs-ssh"
description = "HyperStack SSH client: sessions, shell channels as terminal transports, SFTP, host keys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
hs-core = { workspace = true }
hs-term = { workspace = true }
russh = { workspace = true }
russh-sftp = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-util = { workspace = true }
parking_lot = { workspace = true }
secrecy = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }

[features]
# In-process SSH/SFTP server for tests and the devsshd example.
testserver = []

[dev-dependencies]
tempfile = { workspace = true }
hs-ssh = { path = ".", features = ["testserver"] }

[[example]]
name = "devsshd"
required-features = ["testserver"]
