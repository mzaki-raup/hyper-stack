[package]
name = "hyperstack"
description = "HyperStack — one workspace for everyone who ships software"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "HyperStack"
path = "src/main.rs"

[dependencies]
hs-core = { workspace = true }
hs-ui = { workspace = true }
hs-editor = { workspace = true }
hs-lsp = { workspace = true }
hs-dap = { workspace = true }
hs-term = { workspace = true }
hs-git = { workspace = true }
tool-terminal = { workspace = true }
tool-editor = { workspace = true }
tool-ssh = { workspace = true }
tool-s3 = { workspace = true }
tool-db = { workspace = true }
tool-redis = { workspace = true }
tool-queue = { workspace = true }
tool-nosql = { workspace = true }
tool-logs = { workspace = true }
tool-devtools = { workspace = true }
tool-api = { workspace = true }
tool-graphics = { workspace = true }
tool-browser = { workspace = true }
hs-ssh = { workspace = true }
hs-container = { workspace = true }
tool-containers = { workspace = true }
tool-git = { workspace = true }
rfd = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
egui-phosphor = { workspace = true }
image = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
secrecy = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true }
tempfile = { workspace = true }
# The ER diagram hand-over is asserted as a real document (phase H).
hs-diagram = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Native web views for the browser tool (WebView2). Windows only in this
# release; other platforms build the tool without a page area.
[target.'cfg(windows)'.dependencies]
wry = { version = "0.57", default-features = false, features = ["devtools"] }
raw-window-handle = "0.6"
