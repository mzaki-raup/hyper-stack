# cargo deny configuration (docs/09-ci-cd-and-updates.md §4.1).

[graph]
all-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  # ttf-parser is declared unmaintained upstream. It reaches us only through
  # winit -> sctk-adwaita (Linux Wayland client-side decorations), not through
  # anything HyperStack calls. No fixed version exists; revisit on the next
  # egui/winit upgrade.
  { id = "RUSTSEC-2026-0192", reason = "transitive via winit/sctk-adwaita; no upstream fix yet" },
  # bincode 1.x is "unmaintained" by its own team's declaration (they consider
  # 1.3.3 complete). It reaches us only through syntect's bundled syntax/theme
  # dumps (`default-syntaxes`/`default-themes`), decoded from data compiled
  # into the binary, never from user input. Revisit when syntect moves off it.
  { id = "RUSTSEC-2025-0141", reason = "transitive via syntect's bundled dumps; trusted embedded data only" },
  # The `rsa` crate (Marvin timing side-channel) reaches us through russh's RSA
  # support (ssh-key/rsa). No fixed version exists upstream: the advisory notes
  # the latest rsa is still affected, so the only alternative is dropping RSA
  # keys and ssh-rsa host keys entirely, which would break the common case of
  # existing ~/.ssh/id_rsa and enterprise servers. The exposure is an attacker
  # able to measure the timing of the user's own key signatures on the wire;
  # accepted for a local developer tool. Revisit when rsa ships a mitigation.
  { id = "RUSTSEC-2023-0071", reason = "rsa Marvin attack via russh; no upstream fix, RSA SSH keys still needed" },
  # zvariant, zvariant_derive and zbus_names were folded into zbus 6.0 and
  # are "unmaintained" as standalone crates from 2026-10-17. They reach us
  # through accesskit_unix -> atspi, which is the **Linux** accessibility
  # bridge: nothing on Windows loads them, and HyperStack calls none of
  # them directly. Moving off is accesskit's to do, not ours. Revisit on
  # the next egui/accesskit upgrade.
  { id = "RUSTSEC-2026-0370", reason = "zvariant folded into zbus 6.0; transitive via accesskit_unix/atspi" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names folded into zbus 6.0; transitive via accesskit_unix/atspi" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive folded into zbus 6.0; transitive via accesskit_unix/atspi" },
  # rustybuzz is declared unmaintained upstream. It reaches us through
  # usvg -> resvg: egui_extras' SVG preview and hs-diagram's PNG export. No
  # fixed version exists; the renderer processes local SVG only, never remote
  # content. Revisit when usvg moves to harfrust.
  { id = "RUSTSEC-2026-0206", reason = "transitive via usvg/resvg; local SVG rendering only, no fixed version" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "CDLA-Permissive-2.0",
  "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version; that is not a wildcard risk.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
